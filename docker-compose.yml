version: "3.9"

# ─────────────────────────────────────────────────────────────
#  Chatversio AI Email CRM  –  Full Stack (Postgres + pgvector)
#  Run:   docker compose up --build
#  Open:  http://localhost:5173
#
#  Unique ports:
#    5432  → Postgres + pgvector
#    6379  → Redis
#    8000  → FastAPI
#    4000  → LiteLLM gateway (loopback only)
#    5173  → Frontend
# ─────────────────────────────────────────────────────────────

services:

  # ── Postgres + pgvector ────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatversio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatversio"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── LiteLLM gateway ──────────────────────────────────────────
  # Single egress point for every LLM call. api/worker reach it at
  # http://litellm:4000 (OPENAI_BASE_URL in backend/.env) and it hands back
  # the exact spend for each call in x-litellm-response-cost, so Super Admin
  # shows real cost even for models our own price table doesn't know.
  # Published only on loopback — it is an internal gateway, not a public API.
  litellm:
    # NOTE: do NOT use the `:main` tag here — it has been frozen on a
    # Dec-2023 digest forever (and its entrypoint hardcodes LiteLLM's sample
    # azure config, silently ignoring anything passed in `command`).
    # `:latest` (2026-09-27, sha256:bd089afdcd35…) has the working
    # `exec litellm "$@"` entrypoint and supports
    # configurable_clientside_auth_params, which this proxy relies on.
    image: ghcr.io/berriai/litellm:latest
    restart: unless-stopped
    # No env_file on purpose. The OpenAI key lives in the app's database
    # (Super Admin -> API Keys), not in .env, and the app hands it over in
    # each request body (configurable_clientside_auth_params in
    # litellm/config.yaml). Loading backend/.env here would also hand
    # LiteLLM our DATABASE_URL and make it try to migrate our schema.
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── FastAPI backend ────────────────────────────────────────
  # api/worker/beat share ONE image on purpose. With only `build: ./backend`
  # compose builds a separate image per service, so rebuilding just `api` left
  # the worker running yesterday's code against today's database.
  api:
    image: chatversio-email-crm-backend:latest
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/chatversio
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_ORIGIN=http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000
      --workers 1
      --timeout 120
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  # ── Celery worker ──────────────────────────────────────────
  worker:
    image: chatversio-email-crm-backend:latest
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/chatversio
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.celery_app.celery worker
      --loglevel=info
      --concurrency=2
      --pool=solo

  # ── Celery beat ────────────────────────────────────────────
  beat:
    image: chatversio-email-crm-backend:latest
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/chatversio
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app.celery beat --loglevel=info

  # ── Vite frontend ──────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY=http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata: